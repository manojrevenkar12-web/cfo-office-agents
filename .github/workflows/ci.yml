name: ci
on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with: {python-version: "3.12", cache: pip}
      - run: pip install -r requirements.txt
      - run: ruff check .
      - name: world, platform, engagements, invariants and API
        run: python -m pytest -q
      - name: README matches the reports
        run: python -m cofa.eval.cli readme --check
      - name: committed dev report passes the gate
        run: python -m cofa.eval.cli gate && git diff --exit-code reports/dev.json

  evaluate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with: {python-version: "3.12", cache: pip}
      - run: pip install -r requirements.txt
      - name: the whole month for all three designs, compared with the committed report
        run: |
          cp reports/dev.json /tmp/committed.json
          python -m cofa.eval.cli evaluate
          python - <<'PY'
          import json
          a, b = json.load(open("/tmp/committed.json")), json.load(open("reports/dev.json"))
          for k in ("planted", "business_case", "readers"):
              assert a[k] == b[k], k
          for r in a["runs"]:
              assert a["runs"][r]["cash"] == b["runs"][r]["cash"], r
              assert a["runs"][r]["collections"] == b["runs"][r]["collections"], r
          print("dev results reproduce")
          PY

  web:
    runs-on: ubuntu-latest
    defaults: {run: {working-directory: web}}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with: {node-version: "22", cache: npm, cache-dependency-path: web/package-lock.json}
      - run: npm ci
      - run: npm test
      - run: npm run build

  docker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - run: docker build -t cfo-office-agents .
      - name: the container serves the console and the API
        run: |
          docker run -d -p 8080:8080 --name c cfo-office-agents
          for i in $(seq 1 30); do curl -sf localhost:8080/api/health && break; sleep 2; done
          curl -sf localhost:8080/api/review | python3 -c "import json,sys; print(len(json.load(sys.stdin)['items']), 'items in review')"
          curl -sf localhost:8080/ | grep -q '<div id="root">'
